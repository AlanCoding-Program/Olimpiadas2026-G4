<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/publics/css/login.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
</head>
<body>
    <div class="box1">
        <img class="logo" src="../admin/assets/logo.png" alt="logoEmpresa">
        <div class="links">
            <a class="redirect"  id="registerHTML" href="../views/index.html">Home</a>
            <a class="redirect" href="destinos.html">Destinos</a>
        </div>
    </div>
    <div class="bigBox">
        <div class="fila">
                    <label for="dni">
                        Ingresa tu DNI
                    </label>
                    <input type="text" id="dni" placeholder="12345678">
                </div>
                <div class="fila passwordFila">
                    <label for="password">
                        Ingresa una contraseña
                    </label>
                    <div class="passwordContainer">
                        <input type="password" id="password" placeholder="********">
                        <button type="button" id="togglePassword" aria-label="Mostrar contraseña">
                            <iconify-icon icon="akar-icons:eye"></iconify-icon>
                        </button>
                    </div>
                </div>
    </div>
    <div class="boton">
        <button type="button">
            Enviar
        </button>
    </div>

    <script src="https://code.iconify.design/iconify-icon/3.0.3/iconify-icon.min.js"></script>
</body>
</html>
