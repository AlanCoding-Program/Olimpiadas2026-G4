<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../publics/css/registrar.css">
    <title>Registrar</title>
</head>
<body>
    <div class="box1">
        <img class="logo" src="../admin/assets/logo.png" alt="logoEmpresa">
        <div class="links">
            <a class="redirect"  id="registerHTML" href="../views/index.html">Home</a>
            <a class="redirect" href="destinos.html">Destinos</a>
        </div>
    </div>
    <div class="bigBox">
        <div class="inputs">
            <div class="fila">
                <label for="username">
                    Ingresa tu nombre
                </label>
                <input type="text" id="username" placeholder="Juan">
            </div>
            <div class="fila">
                <label for="surname">
                    Ingresa tu apellido
                </label>
                <input type="text" id="surname" placeholder="Juarez">
            </div>
            <div class="fila">
                <label for="dni">
                    Ingresa tu DNI
                </label>
                <input type="text" id="dni" placeholder="12345678">
            </div>
            <div class="fila passwordFila">
                <label for="password">
                    Ingresa una contraseña
                </label>
                <div class="passwordContainer">
                    <input type="password" id="password" placeholder="********">
                    <button type="button" id="togglePassword" aria-label="Mostrar contraseña">
                        <iconify-icon icon="akar-icons:eye"></iconify-icon>
                    </button>
                </div>
            </div>
        </div>
        <div class="boton">
            <button type="button">
                Enviar
            </button>
        </div>
        <div>
            <a href="../views/login.html">¿Tienes una cuenta? Inicia Sesión</a>
        </div>
    </div>
    <script src="https://code.iconify.design/iconify-icon/3.0.3/iconify-icon.min.js"></script>
    <script src="../publics/js/script.js"></script>
</body>
</html>
